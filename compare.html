<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texas and New York Weather Comparison</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      color: #173b4d;
      background: #f5fbfa;
      --navy: #173b4d;
      --teal: #176b70;
      --sun: #ffd166;
      --coral: #e87561;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 2rem 1rem;
      box-sizing: border-box;
      background-image:
        linear-gradient(135deg, rgba(245, 251, 250, 0.93), rgba(228, 245, 242, 0.84), rgba(255, 242, 216, 0.9)),
        url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2200&q=85");
      background-attachment: fixed;
      background-position: center;
      background-size: cover;
    }

    main {
      width: min(100%, 54rem);
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3rem);
      box-sizing: border-box;
      border: 1px solid rgba(23, 107, 112, 0.16);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1.25rem 3rem rgba(23, 59, 77, 0.14);
      text-align: center;
    }

    .back-link {
      color: var(--teal);
      font-weight: bold;
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
    }

    .eyebrow {
      margin: 2.5rem 0 0.6rem;
      color: var(--coral);
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
    }

    .intro {
      margin: 1rem auto 2rem;
      max-width: 38rem;
      color: #557982;
      font-size: 1.1rem;
      line-height: 1.5;
    }


    .comparison-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border: 1px solid #c6dfdc;
      border-radius: 12px;
      background: #ffffff;
      text-align: left;
    }

    .comparison-table th,
    .comparison-table td {
      padding: 1rem;
      border-bottom: 1px solid #dcecea;
    }

    .comparison-table th {
      color: #ffffff;
      background: var(--teal);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .comparison-table tr:last-child td {
      border-bottom: 0;
    }

    .comparison-table tbody tr:nth-child(even) {
      background: #f2faf8;
    }

    .comparison-table td:first-child {
      color: var(--navy);
      font-weight: bold;
    }

    .temperature-cell {
      color: var(--teal);
      font-size: 1.35rem;
      font-weight: bold;
    }

    .delta-cell {
      color: #855900;
      font-weight: bold;
    }

    .delta {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border: 2px solid #f0c45a;
      border-radius: 14px;
      background: #fff8df;
      color: #855900;
    }

    .delta h2 {
      margin: 0 0 0.5rem;
      font-size: 1.2rem;
    }

    .delta p {
      margin: 0.4rem 0;
    }

    .error {
      color: #a53d3d;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .comparison-table th,
      .comparison-table td {
        padding: 0.75rem 0.5rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="index.html">Back to Louis's Weather Guide</a>
    <p class="eyebrow">Live family trip comparison</p>
    <h1>Texas vs. New York</h1>
    <p class="intro">A quick spreadsheet-style look at the current temperatures in Austin and Albany.</p>
    <section id="comparison" aria-live="polite">
      <p>Loading current conditions...</p>
    </section>
    <section id="delta" class="delta" aria-live="polite">
      <h2>Today's difference</h2>
      <p>Calculating the weather delta...</p>
    </section>
  </main>

  <script>
    const places = [
      { state: "Texas", capital: "Austin", latitude: 30.2672, longitude: -97.7431 },
      { state: "New York", capital: "Albany", latitude: 42.6528, longitude: -73.7579 }
    ];
    const comparisonElement = document.querySelector("#comparison");
    const deltaElement = document.querySelector("#delta");

    async function loadComparison() {
      const latitudes = places.map((place) => place.latitude).join(",");
      const longitudes = places.map((place) => place.longitude).join(",");
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitudes}&longitude=${longitudes}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Weather lookup failed");
        const results = await response.json();
        const texas = results[0].current;
        const newYork = results[1].current;

        const temperatureDelta = Math.round(texas.temperature_2m - newYork.temperature_2m);
        const windDelta = Math.round(texas.wind_speed_10m - newYork.wind_speed_10m);
        const warmerPlace = temperatureDelta >= 0 ? "Texas" : "New York";
        comparisonElement.innerHTML = `
          <table class="comparison-table">
            <thead>
              <tr><th>State</th><th>Current temperature</th><th>Difference</th></tr>
            </thead>
            <tbody>
              <tr>
                <td>Texas <small>(${places[0].capital})</small></td>
                <td class="temperature-cell">${Math.round(texas.temperature_2m)}&deg;F</td>
                <td class="delta-cell">${temperatureDelta >= 0 ? "+" : ""}${temperatureDelta}&deg;F vs. New York</td>
              </tr>
              <tr>
                <td>New York <small>(${places[1].capital})</small></td>
                <td class="temperature-cell">${Math.round(newYork.temperature_2m)}&deg;F</td>
                <td class="delta-cell">${temperatureDelta <= 0 ? "+" : "-"}${Math.abs(temperatureDelta)}&deg;F vs. Texas</td>
              </tr>
            </tbody>
          </table>
        `;
        deltaElement.innerHTML = `
          <h2>Today's difference</h2>
          <p><strong>${warmerPlace}</strong> is ${Math.abs(temperatureDelta)}&deg;F warmer right now.</p>
          <p>Texas has ${Math.abs(windDelta)} mph ${windDelta >= 0 ? "more" : "less"} wind than New York.</p>
        `;
      } catch (error) {
        comparisonElement.innerHTML = '<p class="error">Unable to load the comparison right now.</p>';
        deltaElement.innerHTML = '<h2>Today\'s difference</h2><p class="error">Weather data is unavailable.</p>';
      }
    }

    loadComparison();
  </script>
</body>
</html>
